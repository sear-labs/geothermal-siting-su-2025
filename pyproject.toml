[project]
name = "geothermal-siting-sustainability-2025"
version = "1.0.0"
description = "Geothermal potential on tribal lands and HUBZones (Jones, Munjurpet Sridharan, Aghapour & Rodriguez, Sustainability 2025)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Erick C. Jones Jr." },
  { name = "Chandramouli Munjurpet Sridharan" },
  { name = "Raziye Aghapour" },
  { name = "Angel Rodriguez" },
]
# What the tests need: they read committed inputs and results only.
dependencies = [
  "pandas>=2.0,<3",
]

[project.optional-dependencies]
# What the notebook needs. CoolProp 6.7 is what ran on Colab in 2025.
notebooks = [
  "CoolProp>=6.7,<6.8",  # 6.7.0 ran on Colab; property tables shift between versions
  "jinja2>=3,<4",          # DataFrame.to_latex
  "nbconvert>=7,<8",
  "ipykernel>=6,<8",
  "pyyaml>=6,<7",
]
dev = [
  "pytest>=7,<9",
  "ruff>=0.4,<1",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# One notebook, no importable package. Keeps `pip install -e .` working.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
